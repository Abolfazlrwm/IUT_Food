name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & smoke-test (${{ matrix.os }}, Qt ${{ matrix.qt-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qt-version: "6.8"
          - os: windows-2022
            qt-version: "6.8"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Qt ${{ matrix.qt-version }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt-version }}
          modules: qtcharts qtimageformats
          cache: true

      - name: Configure (CMake)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j"$(nproc 2>/dev/null || echo 4)"
        shell: bash

      - name: Unit tests (Qt Test)
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Smoke test (server + full protocol)
        run: |
          SERVER=$( (ls build/iut-food-server* build/Release/iut-food-server* 2>/dev/null || true) | head -1 )
          if [ -z "$SERVER" ]; then
            echo "server binary not found"; find build -maxdepth 2 -name '*server*'; exit 1
          fi
          echo "server binary: $SERVER"
          "$SERVER" --port 1234 --db ci_server.db &
          SERVER_PID=$!
          sleep 3
          python3 scripts/smoke_test.py || python scripts/smoke_test.py
          STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS
        shell: bash

      - name: Smoke test over TLS (Ubuntu leg)
        if: runner.os == 'Linux'
        run: |
          SERVER=$( (ls build/iut-food-server* build/Release/iut-food-server* 2>/dev/null || true) | head -1 )
          "$SERVER" --port 1235 --db ci_tls_server.db \
            --tls-cert tests/certs/test_cert.pem --tls-key tests/certs/test_key.pem &
          SERVER_PID=$!
          sleep 3
          python3 scripts/smoke_test.py --tls --port 1235 || python scripts/smoke_test.py --tls --port 1235
          STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS
        shell: bash

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: iut-food-${{ matrix.os }}-qt${{ matrix.qt-version }}
          path: |
            build/iut-food-client*
            build/iut-food-server*
            build/Release/iut-food-client*
            build/Release/iut-food-server*
          if-no-files-found: error

  # Distro-Qt build: proves the project compiles and its test suites pass
  # against the Qt 6 packages shipped by Ubuntu 24.04 (Qt 6.4.2) from apt,
  # i.e. without any SDK manager. Complements the Qt 6.8 matrix above.
  apt-build:
    name: Build with distro Qt 6 (apt, Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Qt 6 toolchain from apt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ qt6-base-dev qt6-charts-dev libgl1-mesa-dev

      - name: Configure (CMake)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests (Qt Test)
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: ASan + UBSan clean run (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8"
          modules: qtcharts qtimageformats
          cache: true

      # The whole suite compiled with -fsanitize=address,undefined and
      # -fno-sanitize-recover=all: any heap overflow, use-after-free or
      # undefined behaviour in project code turns every following test
      # red.  Leak detection stays off in the preset environment - Qt
      # keeps intentional process-lifetime singletons that LeakSanitizer
      # would otherwise report as false positives.
      - name: Configure (ASan + UBSan preset)
        run: cmake --preset linux-asan

      - name: Build
        run: cmake --build --preset linux-asan -j"$(nproc 2>/dev/null || echo 4)"
        shell: bash

      - name: Unit tests under sanitizers
        run: ctest --preset linux-asan

  docker:
    name: Docker image & container smoke test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build the server image
        run: docker build -t iut-food-server .

      - name: Run the container and smoke-test it
        run: |
          docker run -d --name iut-server -p 1234:1234 iut-food-server
          sleep 3
          python3 scripts/smoke_test.py
          docker logs iut-server 2>&1 | tail -5
          docker rm -f iut-server > /dev/null

      - name: HEALTHCHECK goes green (inspect reports healthy)
        run: |
          docker run -d --name iut-hc iut-food-server
          for i in $(seq 1 12); do
            STATUS=$(docker inspect --format '{{.State.Health.Status}}' iut-hc 2>/dev/null || echo starting)
            echo "health: $STATUS"
            [ "$STATUS" = "healthy" ] && break
            sleep 5
          done
          [ "$STATUS" = "healthy" ] || { docker logs iut-hc >&2; exit 1; }
          docker rm -f iut-hc > /dev/null
