name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & smoke-test (Ubuntu, Qt ${{ matrix.qt-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        qt-version: ["6.8"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Qt ${{ matrix.qt-version }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt-version }}
          modules: qtcharts qtimageformats
          cache: true

      - name: Configure (CMake)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Smoke test (server + full protocol)
        run: |
          ./build/iut-food-server --port 1234 --db ci_server.db &
          SERVER_PID=$!
          sleep 2
          python3 scripts/smoke_test.py
          STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: iut-food-ubuntu-qt${{ matrix.qt-version }}
          path: |
            build/iut-food-client
            build/iut-food-server
          if-no-files-found: error
