name: Release

# Attach ready-to-run artifacts to every version tag:
#   - a portable Windows build (Qt DLLs bundled with windeployqt)
#   - a portable Linux tarball plus a self-contained Debian package
#   - a macOS DMG (client .app deployed with macdeployqt)
#   - an Android APK (arm64-v8a, debug-signed) built with the Qt 6
#     Android kit against the NDK on the GitHub runner
# Each artifact ships with a SHA-256 checksum.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}   # manual re-run of failed artifact jobs

permissions:
  contents: write

jobs:
  windows-portable:
    name: Portable Windows build
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8"
          modules: qtcharts qtimageformats
          cache: true

      - name: Configure and build
        shell: bash
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j"$(nproc 2>/dev/null || echo 4)"

      - name: Stage the portable layout
        shell: bash
        run: |
          mkdir -p dist
          CLI=$( (ls build/iut-food-client.exe build/Release/iut-food-client.exe 2>/dev/null || true) | head -1 )
          SRV=$( (ls build/iut-food-server.exe build/Release/iut-food-server.exe 2>/dev/null || true) | head -1 )
          if [ -z "$CLI" ] || [ -z "$SRV" ]; then
            echo "binaries not found"; find build -maxdepth 2 -name '*.exe'; exit 1
          fi
          cp "$CLI" dist/iut-food-client.exe
          cp "$SRV" dist/iut-food-server.exe
          windeployqt --release --no-translations --no-system-d3d-compiler \
            --no-opengl-sw dist/iut-food-client.exe
          # The server needs QtCore/QtNetwork/QtSql from the same folder.
          cp README.md LICENSE CHANGELOG.md dist/

      - name: Run the smoke suite against the packaged server
        shell: bash
        run: |
          ./dist/iut-food-server.exe --port 1234 --db ci_server.db &
          SERVER_PID=$!
          sleep 3
          python scripts/smoke_test.py
          kill $SERVER_PID 2>/dev/null || true

      - name: Checksum and zip
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="IUT-Food-${VERSION}-windows-x64"
          mv dist "$STAGE"
          find "$STAGE" -type f -print0 | sort -z | xargs -0 sha256sum > checksums-windows.txt
          7z a "$STAGE.zip" "$STAGE"
          mv checksums-windows.txt "$STAGE-checksums.txt"

      - name: Upload to the release
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "IUT-Food $GITHUB_REF_NAME" \
              --notes "Automated release artifacts (notes are maintained in the repository docs)."
          gh release upload "$GITHUB_REF_NAME" *.zip *-checksums.txt --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  linux-portable:
    name: Linux tarball + deb
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8"
          modules: qtcharts qtimageformats
          cache: true

      - name: Configure and build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Run the smoke suite
        run: |
          ./build/iut-food-server --port 1234 --db ci_server.db &
          SERVER_PID=$!
          sleep 2
          python3 scripts/smoke_test.py
          kill $SERVER_PID 2>/dev/null || true

      - name: Build the self-contained Debian package
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q patchelf
          VERSION="${GITHUB_REF_NAME#v}"
          scripts/package_deb.sh "$VERSION" build .

      - name: Checksum and tar
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="IUT-Food-${VERSION}-linux-x64"
          mkdir "$STAGE"
          cp build/iut-food-client build/iut-food-server "$STAGE"/
          cp README.md LICENSE CHANGELOG.md "$STAGE"/
          {
            echo "The binaries need the Qt 6 runtime libraries (Core, Gui, Widgets,"
            echo "Network, Sql, Charts). On Debian/Ubuntu:"
            echo
            echo "    sudo apt install qt6-base-dev libqt6charts6"
            echo
            echo "Or install the bundled .deb (no system Qt needed):"
            echo
            echo "    sudo apt install ./iut-food_${VERSION}_amd64.deb"
            echo
            echo "Or run the server without any host Qt via Docker:"
            echo
            echo "    docker build -t iut-food-server . && docker run -p 1234:1234 iut-food-server"
          } > "$STAGE/README-LINUX.txt"
          {
            find "$STAGE" -type f -print0 | sort -z | xargs -0 sha256sum
            sha256sum "iut-food_${VERSION}_amd64.deb"
          } > "$STAGE-checksums.txt"
          tar czf "$STAGE.tar.gz" "$STAGE"

      - name: Upload to the release
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "IUT-Food $GITHUB_REF_NAME" \
              --notes "Automated release artifacts (notes are maintained in the repository docs)."
          gh release upload "$GITHUB_REF_NAME" *.tar.gz *.deb *-checksums.txt --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  macos-dmg:
    name: macOS DMG (client)
    # macos-14 jobs were cancelled at provisioning time on this repo;
    # macos-15 is the currently served macOS ARM64 image.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8"
          modules: qtcharts qtimageformats
          cache: true

      - name: Configure and build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Deploy the client bundle into a DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ls build/*.app
          macdeployqt build/iut-food-client.app -dmg -always-overwrite
          mv build/iut-food-client.dmg "IUT-Food-${VERSION}-macos.dmg"
          shasum -a 256 "IUT-Food-${VERSION}-macos.dmg" > "IUT-Food-${VERSION}-macos-checksums.txt"

      - name: Upload to the release
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "IUT-Food $GITHUB_REF_NAME" \
              --notes "Automated release artifacts (notes are maintained in the repository docs)."
          gh release upload "$GITHUB_REF_NAME" *.dmg *-macos-checksums.txt --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  android-apk:
    name: Android APK (arm64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make sure an NDK is available (r26, the line Qt 6.6 supports)
        run: |
          NDK_DIR="$ANDROID_HOME/ndk/26.3.11579264"
          if [ ! -d "$NDK_DIR" ]; then
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager --install "ndk;26.3.11579264"
          fi
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK: $NDK_DIR"

      - name: Install Qt 6.6 for Android (arm64-v8a)
        uses: jurplel/install-qt-action@v4
        with:
          # Qt 6.7/6.8 ship no Android binaries on the linux-host
          # qtsdkrepository channel (it stops at qt6_663), so the APK
          # cross-builds against the newest Android-enabled Qt.
          version: "6.6.3"
          host: linux
          target: android
          arch: android_arm64_v8a
          modules: qtcharts qtimageformats
          cache: true

      - name: Configure the cross build
        run: |
          cmake -B build-android -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DQT_ANDROID_BUILD_ALL_ABIS=OFF

      - name: Build
        run: cmake --build build-android -j"$(nproc)"

      - name: Package the APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="IUT-Food-${VERSION}-android-arm64.apk"
          # The Qt 6 android build exposes an `apk` convenience target;
          # fall back to androiddeployqt directly if it is missing.
          cmake --build build-android --target apk || {
            SETTINGS="$(ls build-android/android_*_deployment_settings.json | head -1)"
            "$QT_ROOT_DIR/bin/androiddeployqt" --input "$SETTINGS" \
              --output build-android/android-build --apk "$OUT"
          }
          APK="$(ls build-android/android-build/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)"
          [ -n "$APK" ] || APK="$(ls build-android/**/*.apk 2>/dev/null | head -1)"
          [ -n "$APK" ] || { echo "no APK produced"; find build-android -name '*.apk'; exit 1; }
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "IUT-Food-${VERSION}-android-checksums.txt"

      - name: Upload to the release
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "IUT-Food $GITHUB_REF_NAME" \
              --notes "Automated release artifacts (notes are maintained in the repository docs)."
          gh release upload "$GITHUB_REF_NAME" *.apk *-android-checksums.txt --clobber
        env:
          GH_TOKEN: ${{ github.token }}
