name: Release

# Attach ready-to-run artifacts to every version tag:
#   - a portable Windows build (Qt DLLs bundled with windeployqt)
#   - a portable Linux tarball plus a self-contained Debian package
#   - a macOS DMG (client .app deployed with macdeployqt)
#   - an Android APK (arm64-v8a, debug-signed) built with the Qt 6
#     Android kit against the NDK on the GitHub runner
# Every desktop archive extracts into ONE folder: the two executables
# (double-click launchers on Windows) on top, docs/ and licenses/
# beside them and a bilingual START-HERE.txt so the first run is
# obvious.  Each artifact ships with a SHA-256 checksum.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}   # manual re-run of failed artifact jobs

permissions:
  contents: write

jobs:
  windows-portable:
    name: Portable Windows build
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8"
          modules: qtcharts qtimageformats
          cache: true

      - name: Configure and build
        shell: bash
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j"$(nproc 2>/dev/null || echo 4)"

      - name: Stage the portable layout
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/runtime dist/docs/adr dist/licenses
          CLI=$( (ls build/iut-food-client.exe build/Release/iut-food-client.exe 2>/dev/null || true) | head -1 )
          SRV=$( (ls build/iut-food-server.exe build/Release/iut-food-server.exe 2>/dev/null || true) | head -1 )
          if [ -z "$CLI" ] || [ -z "$SRV" ]; then
            echo "binaries not found"; find build -maxdepth 2 -name '*.exe'; exit 1
          fi
          # One folder: the double-click launchers on top, the Qt
          # runtime next to the binaries, docs and licenses in folders.
          cp "$CLI" dist/runtime/iut-food-client.exe
          cp "$SRV" dist/runtime/iut-food-server.exe
          windeployqt --release --no-translations --no-system-d3d-compiler \
            --no-opengl-sw dist/runtime/iut-food-client.exe
          # The server needs QtCore/QtNetwork/QtSql from the same folder.
          cp README.md CHANGELOG.md docs/*.md dist/docs/
          cp docs/adr/*.md dist/docs/adr/
          cp LICENSE NOTICE.md fonts/OFL-LICENSE.txt dist/licenses/
          printf '\xef\xbb\xbf' > dist/START-HERE.txt
          cat >> dist/START-HERE.txt <<IUT_EOF
          IUT-Food ${VERSION} - campus food ordering (client + server)
          =============================================================

          WHAT'S HERE
            IUT-Food Client.cmd    double-click to start the desktop app
            IUT-Food Server.cmd    double-click to start the server (console)
            runtime\               the executables + their Qt libraries
            docs\                  full documentation (README, PROTOCOL,
                                   ARCHITECTURE, DEMO, ANDROID, METRICS)
            licenses\              LICENSE, NOTICE.md, bundled-font license

          QUICK START (2 minutes)
            1. Double-click "IUT-Food Server.cmd" and keep its window open.
            2. Double-click "IUT-Food Client.cmd".
            3. Log in with admin / admin123 (demo data is seeded on first run).

          شروع سریع
            ۱. روی «IUT-Food Server.cmd» دوبار کلیک کنید و پنجره‌ی سرور را باز نگه دارید.
            ۲. روی «IUT-Food Client.cmd» دوبار کلیک کنید.
            ۳. با نام کاربری admin و رمز admin123 وارد شوید؛ داده‌های نمونه در
               نخستین اجرا ساخته می‌شوند.

          NOTES
            - Portable: the demo database is created inside runtime\ on first
              run; delete runtime\*.db for a factory reset.
            - The binaries are unsigned CI builds: if SmartScreen appears,
              choose "More info" -> "Run anyway".
            - The server listens on port 1234; docs\ANDROID.md links a phone
              to this server, docs\PROTOCOL.md documents the wire format.
          IUT_EOF
          printf '@echo off\r\nstart "" "%%~dp0runtime\\iut-food-client.exe" %%*\r\n' > "dist/IUT-Food Client.cmd"
          printf '@echo off\r\ncd /d "%%~dp0runtime"\r\niut-food-server.exe %%*\r\n' > "dist/IUT-Food Server.cmd"

      - name: Run the smoke suite against the packaged server
        shell: bash
        run: |
          ./dist/runtime/iut-food-server.exe --port 1234 --db ci_server.db &
          SERVER_PID=$!
          sleep 3
          python scripts/smoke_test.py
          kill $SERVER_PID 2>/dev/null || true

      - name: Checksum and zip
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="IUT-Food-${VERSION}-windows-x64"
          mv dist "$STAGE"
          find "$STAGE" -type f -print0 | sort -z | xargs -0 sha256sum > checksums-windows.txt
          7z a "$STAGE.zip" "$STAGE"
          mv checksums-windows.txt "$STAGE-checksums.txt"

      - name: Upload to the release
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "IUT-Food $GITHUB_REF_NAME" \
              --notes "Automated release artifacts (notes are maintained in the repository docs)."
          gh release upload "$GITHUB_REF_NAME" *.zip *-checksums.txt --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  linux-portable:
    name: Linux tarball + deb
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8"
          modules: qtcharts qtimageformats
          cache: true

      - name: Configure and build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Run the smoke suite
        run: |
          ./build/iut-food-server --port 1234 --db ci_server.db &
          SERVER_PID=$!
          sleep 2
          python3 scripts/smoke_test.py
          kill $SERVER_PID 2>/dev/null || true

      - name: Build the self-contained Debian package
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q patchelf
          VERSION="${GITHUB_REF_NAME#v}"
          scripts/package_deb.sh "$VERSION" build .

      - name: Checksum and tar
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="IUT-Food-${VERSION}-linux-x64"
          mkdir -p "$STAGE/docs/adr" "$STAGE/licenses" "$STAGE/desktop"
          cp build/iut-food-client build/iut-food-server "$STAGE"/
          cp README.md CHANGELOG.md docs/*.md "$STAGE/docs"/
          cp docs/adr/*.md "$STAGE/docs/adr/"
          cp LICENSE NOTICE.md fonts/OFL-LICENSE.txt "$STAGE/licenses"/
          cp packaging/linux/iut-food-client.desktop "$STAGE/desktop/"
          cp packaging/linux/iut-food.png "$STAGE/desktop/iut-food-icon.png"
          cp packaging/linux/install-desktop.sh "$STAGE/desktop/"
          chmod +x "$STAGE/desktop/install-desktop.sh"
          printf '\xef\xbb\xbf' > "$STAGE/START-HERE.txt"
          cat >> "$STAGE/START-HERE.txt" <<IUT_EOF
          IUT-Food ${VERSION} - campus food ordering (client + server)
          =============================================================

          WHAT'S HERE
            iut-food-client    the desktop app
            iut-food-server    the server (console)
            docs/              full documentation (README, PROTOCOL,
                               ARCHITECTURE, DEMO, ANDROID, METRICS)
            licenses/          LICENSE, NOTICE.md, bundled-font license
            desktop/           optional menu-entry installer (see below)

          QUICK START (2 minutes)
            ./iut-food-server --port 1234 --db server.db   # keep this terminal
            ./iut-food-client                              # second terminal
            Log in with admin / admin123 (demo data is seeded on first run).

          شروع سریع
            ./iut-food-server --port 1234 --db server.db   (ترمینال اول)
            ./iut-food-client                              (ترمینال دوم)
            با admin / admin123 وارد شوید؛ داده‌های نمونه در نخستین اجرا ساخته می‌شوند.

          THE QT RUNTIME
            The binaries need the Qt 6 libraries (Core, Gui, Widgets, Network,
            Sql, Charts).  On Debian/Ubuntu:

                sudo apt install qt6-base-dev libqt6charts6 libqt6sql6-sqlite

            Or install the bundled .deb instead - it carries its own Qt:

                sudo apt install ./iut-food_${VERSION}_amd64.deb

            Or run the server with no host Qt at all via Docker:

                docker build -t iut-food-server . && docker run -p 1234:1234 iut-food-server

          DESKTOP MENU ENTRY (optional)
            cd desktop && ./install-desktop.sh
          IUT_EOF
          {
            find "$STAGE" -type f -print0 | sort -z | xargs -0 sha256sum
            sha256sum "iut-food_${VERSION}_amd64.deb"
          } > "$STAGE-checksums.txt"
          tar czf "$STAGE.tar.gz" "$STAGE"

      - name: Upload to the release
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "IUT-Food $GITHUB_REF_NAME" \
              --notes "Automated release artifacts (notes are maintained in the repository docs)."
          gh release upload "$GITHUB_REF_NAME" *.tar.gz *.deb *-checksums.txt --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  macos-dmg:
    name: macOS DMG (client)
    # macos-14 jobs were cancelled at provisioning time on this repo;
    # macos-15 is the currently served macOS ARM64 image.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8"
          modules: qtcharts qtimageformats
          cache: true

      - name: Configure and build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Deploy the client bundle into a DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ls build/*.app
          macdeployqt build/iut-food-client.app -dmg -always-overwrite
          mv build/iut-food-client.dmg "IUT-Food-${VERSION}-macos.dmg"
          shasum -a 256 "IUT-Food-${VERSION}-macos.dmg" > "IUT-Food-${VERSION}-macos-checksums.txt"

      - name: Upload to the release
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "IUT-Food $GITHUB_REF_NAME" \
              --notes "Automated release artifacts (notes are maintained in the repository docs)."
          gh release upload "$GITHUB_REF_NAME" *.dmg *-macos-checksums.txt --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  android-apk:
    name: Android APK (arm64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare the Android SDK (NDK r26 + platform android-34)
        run: |
          # sdkmanager is not on PATH on the runner image; it lives in
          # the command-line tools dir under ANDROID_HOME.
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR="$(command -v sdkmanager || true)"
          NDK_DIR="$ANDROID_HOME/ndk/26.3.11579264"
          if [ ! -d "$NDK_DIR" ]; then
            if [ -z "$SDKMGR" ]; then
              echo "no sdkmanager under $ANDROID_HOME/cmdline-tools" >&2
              ls "$ANDROID_HOME" "$ANDROID_HOME/cmdline-tools" 2>/dev/null || true
              exit 1
            fi
            yes | "$SDKMGR" --licenses >/dev/null || true
            "$SDKMGR" --install "ndk;26.3.11579264"
          fi
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK: $NDK_DIR"
          # androiddeployqt builds against the HIGHEST installed platform.
          # The runner's android-36-ext19 jar cannot be parsed by the
          # aapt2 that ships with the AGP 7.4.1 Qt 6.6 templates use
          # (RES_TABLE_TYPE_TYPE overlap), so keep android-34 - the API
          # level Qt 6.6 targets - as the highest one available.
          echo "platforms before: $(ls "$ANDROID_HOME/platforms" 2>/dev/null | tr '\n' ' ')"
          for p in "$ANDROID_HOME"/platforms/android-3[5-9]* \
                   "$ANDROID_HOME"/platforms/android-4[0-9]* \
                   "$ANDROID_HOME"/platforms/android-3[0-9]-ext*; do
            [ -e "$p" ] && rm -rf "$p"
          done
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
            "$SDKMGR" --install "platforms;android-34"
          fi
          echo "platforms after: $(ls "$ANDROID_HOME/platforms" 2>/dev/null | tr '\n' ' ')"

      - name: Install Qt 6.6 for Android (arm64-v8a)
        uses: jurplel/install-qt-action@v4
        with:
          # Qt 6.7/6.8 ship no Android binaries on the linux-host
          # qtsdkrepository channel (it stops at qt6_663), so the APK
          # cross-builds against the newest Android-enabled Qt.
          version: "6.6.3"
          host: linux
          target: android
          arch: android_arm64_v8a
          modules: qtcharts qtimageformats
          cache: true

      - name: Configure the cross build
        run: |
          cmake -B build-android -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DQT_ANDROID_BUILD_ALL_ABIS=OFF

      - name: Build
        run: cmake --build build-android -j"$(nproc)"

      - name: Package the APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="IUT-Food-${VERSION}-android-arm64.apk"
          # The Qt 6 android build exposes an `apk` convenience target;
          # fall back to androiddeployqt directly if it is missing.
          cmake --build build-android --target apk || {
            # Qt names the file android-<target>-deployment-settings.json
            SETTINGS="$(ls build-android/android-*deployment-settings.json 2>/dev/null | head -1)"
            "$QT_ROOT_DIR/bin/androiddeployqt" --input "$SETTINGS" \
              --output build-android/android-build --apk "$OUT"
          }
          APK="$(ls build-android/android-build/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)"
          [ -n "$APK" ] || APK="$(ls build-android/**/*.apk 2>/dev/null | head -1)"
          [ -n "$APK" ] || { echo "no APK produced"; find build-android -name '*.apk'; exit 1; }
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "IUT-Food-${VERSION}-android-checksums.txt"

      - name: Upload to the release
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "IUT-Food $GITHUB_REF_NAME" \
              --notes "Automated release artifacts (notes are maintained in the repository docs)."
          gh release upload "$GITHUB_REF_NAME" *.apk *-android-checksums.txt --clobber
        env:
          GH_TOKEN: ${{ github.token }}
