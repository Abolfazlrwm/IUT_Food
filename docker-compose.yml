# One-command demo stack: the IUT-Food TCP server with a persistent
# database volume.  Start it with `docker compose up`, then point the
# client launcher at localhost:1234.
#
# TLS demo (v2.3): generate a self-signed certificate first
#   sh scripts/generate_certs.sh
# then start the encrypted stack with
#   docker compose --profile tls up server-tls
# and tick "TLS" in the client login dialog.
#
# Logging (v2.4): both services append to /data/logs/server.log inside
# the data volume (size-rotated, 3 generations), so `docker compose
# logs` history survives container recreation.
#
# Operations (v2.5): both services also write rolling SQLite snapshots
# to /data/backups and a JSONL audit trail to /data/audit/audit.jsonl
# inside the same volume - snapshots survive `docker stop`, and every
# login, moderation and wallet event is on the record.
#
# Observability (v2.7): the main service also serves Prometheus metrics
# on http://localhost:9101/metrics (scrape config in docs/METRICS.md),
# and both services expose a Docker healthcheck driven by the new
# `--healthcheck` probe - `docker ps` shows a green "healthy" state.
services:
  server:
    build: .
    image: iut-food-server
    ports:
      - "1234:1234"
      - "9101:9101"
    volumes:
      - iut-food-data:/data
    command: ["--port", "1234", "--db", "/data/iut_food.db",
              "--log-file", "/data/logs/server.log", "--log-level", "info",
              "--backup-dir", "/data/backups", "--backup-interval", "60",
              "--audit-file", "/data/audit/audit.jsonl",
              "--metrics-port", "9101"]
    healthcheck:
      test: ["CMD", "/app/iut-food-server", "--healthcheck", "--port", "1234"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  # Same image, started with the TLS flags; the certificate is expected
  # in ./certs (created by scripts/generate_certs.sh).  Activated only
  # through the "tls" profile so the plain stack stays the default.
  server-tls:
    profiles: ["tls"]
    build: .
    image: iut-food-server
    ports:
      - "1234:1234"
    volumes:
      - iut-food-data:/data
      - ./certs:/certs:ro
    command: ["--port", "1234", "--db", "/data/iut_food.db",
              "--tls-cert", "/certs/server.crt", "--tls-key", "/certs/server.key",
              "--log-file", "/data/logs/server.log", "--log-level", "info",
              "--backup-dir", "/data/backups", "--backup-interval", "60",
              "--audit-file", "/data/audit/audit.jsonl"]
    healthcheck:
      test: ["CMD", "/app/iut-food-server", "--healthcheck", "--port", "1234"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

volumes:
  iut-food-data:
